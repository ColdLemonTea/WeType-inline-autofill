name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          : "${KEYSTORE_BASE64:?Set the KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Set the KEYSTORE_PASSWORD repository secret}"
          : "${ALIAS:?Set the ALIAS repository secret}"
          : "${KEY_PASSWORD:?Set the KEY_PASSWORD repository secret}"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true

      - name: Test, lint and build signed release
        env:
          SIGNING_KEY: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest assembleDebug lintDebug assembleRelease

      - name: Verify APK signature
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG=$(jq -er '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          git check-ref-format "refs/tags/$RELEASE_TAG"
          tag_commit=$(git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG^{commit}" || true)
          if [[ -n "$tag_commit" && "$tag_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG points to another commit. Bump versionName before releasing."
            exit 1
          fi
          apk=app/build/outputs/apk/release/app-release.apk
          mapping=app/build/outputs/mapping/release/mapping.txt
          if gh release view --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" "$apk" "$mapping"
          else
            gh release create --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes -- "$RELEASE_TAG" "$apk" "$mapping"
          fi

      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/release.keystore"
